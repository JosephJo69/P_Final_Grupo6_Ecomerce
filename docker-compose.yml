version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: mongo_db
    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: springboot_app
    restart: always

    depends_on:
      - postgres
      - mongo

    ports:
      - "8081:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  postgres_data:
  mongo_data: